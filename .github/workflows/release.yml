name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        # VERSION (file), cyrius.cyml [package].version (via ${file:VERSION}),
        # and the git tag must all agree before a release artifact ships.
        # Mismatch fails the run.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        # Upstream installer (lays out the version-matched snapshot at
        # $HOME/.cyrius/versions/<ver>/lib — required since 6.2.x, see ci.yml).
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build
        # 1.6.6 — CYRIUS_DCE=1 per CLAUDE.md § CI/Release. It was stated as
        # current practice and was in neither workflow, so CI had been
        # measuring a different artifact than the one the docs describe
        # (binary size is a tracked release metric).
        run: |
          cyrius deps
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/agora

      - name: Test
        # 1.7.0 — the release workflow built and PUBLISHED without running a
        # single test. CI ran them on push, but a tag could be cut from any
        # commit, so nothing structurally prevented shipping a red tree; the
        # Closeout Pass's "full test suite" gate lived only in CLAUDE.md prose.
        run: cyrius test src/test.cyr

      - name: Fuzz the IAC parser
        # 1.7.0 (roadmap N4) — same gate as ci.yml. See that file for why this
        # harness has teeth (mutation-proven on two axes) and how to reproduce
        # a failure locally.
        run: cyrius fuzz fuzz/telnet_iac.fcyr

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*

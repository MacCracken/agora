name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml gates on this workflow via `uses: ./.github/workflows/ci.yml`.
  # GitHub Actions requires the called workflow to opt in via `workflow_call:`
  # — without this, the release-tag run trips on the CI-gate step.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Reads the pinned cyrius version out of cyrius.cyml [package].cyrius
        # — the single source of truth per first-party-standards. Override
        # with CYRIUS_VERSION env var if a CI-side rebuild against a
        # different toolchain is ever needed.
        #
        # Uses the UPSTREAM installer (the same one patra / sigil use). Since
        # 6.2.x, cyrius resolves stdlib modules from the version-matched
        # snapshot at $HOME/.cyrius/versions/<ver>/lib — NOT a flat
        # $HOME/.cyrius/lib copy. The old hand-rolled "extract tarball + cp
        # lib/* into ~/.cyrius/lib" install produced the flat layout, so
        # `cyrius deps` failed with "pins 6.2.2 but it is not installed at
        # .../versions/6.2.2/lib" (and could not read sigil's u256/thread
        # deps). install.sh lays out the versioned snapshot correctly.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        # 1.6.6 — CYRIUS_DCE=1 per CLAUDE.md § CI/Release. It was stated as
        # current practice and was in neither workflow, so CI had been
        # measuring a different artifact than the one the docs describe
        # (binary size is a tracked release metric).
        # Binary name `agora` matches the repo name and cyrius.cyml
        # [build].output, so no naming-divergence handling needed
        # (cf. kii / bannermanor's CI which carry an explanatory comment).
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/agora

      - name: Version drift check
        # The version strings in src/main.cyr (print_banner, cmd_version,
        # connection MOTD) are hand-edited at each milestone close. This
        # step catches the class of drift where VERSION bumps but the
        # literal doesn't (or vice versa). Auto-generated literals from
        # a `version_str.cyr` build-hook are a v1.0 close-out item —
        # see CHANGELOG [0.2.0] note about the inlined-version-string
        # technical debt.
        run: |
          EXPECTED="agora $(cat VERSION | tr -d '[:space:]')"
          ACTUAL=$(./build/agora --version | head -1)
          test "$ACTUAL" = "$EXPECTED" || { echo "version drift: binary says '$ACTUAL', VERSION says '$EXPECTED'"; exit 1; }

      - name: Test
        # Explicit `src/test.cyr` path: at cyrius 6.0.1 bare `cyrius
        # test` only searches tests/*.tcyr and exits 1 if nothing's
        # there (it does NOT fall back to [build].test in cyrius.cyml,
        # despite that being implied by kii's CI comment from cyrius
        # 5.6.28). Until we land a tests/agora.tcyr split (likely at
        # M5+ when persistence widens the test surface), the explicit
        # path is the working form. Runs the full unit suite — RFC 854 /
        # 1143 / 1073 / 1091 / 1184 conformance plus storage, accounts,
        # policy and every door game. The count lives in
        # docs/development/state.md, deliberately not here: this comment
        # said "24-test" from 0.2.0 until 1.7.0, by which point it was 221.
        run: cyrius test src/test.cyr

      - name: Fuzz the IAC parser
        # 1.7.0 (roadmap N4) — CLAUDE.md § Key Principles has stated "fuzz every
        # parser path — IAC sequences are adversarial-by-default" since 0.2.0,
        # with no harness and no CI step behind it. `fuzz/telnet_iac.fcyr`
        # drives well over a million bytes through telnet_feed /
        # telnet_handle_sb across five passes and asserts
        # its own invariants (state range, buffer bounds, TERMINAL_TYPE length,
        # option Q-state range, reset cleanliness), exiting with a distinct code
        # per violated invariant. It is mutation-proven on two independent axes:
        # deleting the TERM_TYPE_CAP clamp (the CVE-2020-10188 shape) or the
        # subneg accumulator bound each turns this step RED.
        #
        # The PRNG seed is fixed, so a CI failure reproduces locally byte for
        # byte — `cyrius fuzz fuzz/telnet_iac.fcyr`.
        run: cyrius fuzz fuzz/telnet_iac.fcyr
